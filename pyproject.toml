[project]
name = "instagram-games-backend"
version = "0.1.0"
description = "Authoritative backend for chat-native social games"
requires-python = ">=3.12"
dependencies = [
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "numpy>=2.0,<3",
  "pydantic-settings>=2.6,<3",
  "pyjwt[crypto]>=2.10,<3",
  "scikit-learn>=1.5,<2",
  "uvicorn[standard]>=0.32,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.8,<1"]
# Offline only (scripts/build_memory.py). The API server never loads a model.
ml = ["sentence-transformers>=3.0,<6"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

